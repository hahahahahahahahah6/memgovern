[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memgovern"
version = "0.1.0"
description = "Memory governance for AI agents: decay, tombstones, conflict arbitration, audit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hao li"}]
keywords = ["ai-agents", "memory", "governance", "tombstone", "decay"]

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/memgovern"

[tool.setuptools.packages.find]
include = ["memgovern*"]
